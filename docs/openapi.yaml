openapi: 3.0.3
info:
  title: 매장 재고 보충 API
  version: 0.1.0
  description: |
    로그인 전후에는 GET /api/v1/csrf를 호출하고 받은 값을 쓰기 요청의 X-CSRF-TOKEN에 넣는다.
    데모의 출발 창고·도착 매장 선택값은 기초 데이터에서 제공한다. 임시 저장과 반려는 후속 범위다.
    보충 신청, 상세 조회, 승인, 출고 지시 생성 전 전체 취소의 초기 계약이다.
    ID는 PostgreSQL bigint의 정밀도를 브라우저에서도 유지하도록 문자열로 전달한다.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/v1/session:
    get:
      operationId: getSession
      summary: 현재 계정과 화면 표시 권한을 조회한다
      responses:
        '200':
          description: 활성 소속 매장 및 선택 가능한 창고 ID를 반환한다.
          content:
            application/json:
              schema:
                type: object
                required: [username, roles, storeIds, warehouseIds, approvalWarehouseIds, outboundWarehouseIds]
                properties:
                  username: { type: string }
                  roles:
                    type: array
                    items: { type: string, enum: [STORE, APPROVER, LOGISTICS_OPERATOR] }
                  storeIds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Id'
                  warehouseIds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Id'
                  outboundWarehouseIds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Id'
                  approvalWarehouseIds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: login
      summary: 로그인하고 세션을 발급한다
      security: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '204':
          description: 로그인 성공. 세션 쿠키를 발급하고 CSRF 토큰을 다시 조회해야 한다.
          headers:
            Set-Cookie:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/logout:
    post:
      operationId: logout
      summary: 현재 세션을 종료한다
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: 세션 종료
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/csrf:
    get:
      operationId: getCsrfToken
      summary: 현재 세션의 CSRF 토큰을 조회한다
      security: []
      responses:
        '200':
          description: 로그인 전후에 사용하는 세션 연계 토큰
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Set-Cookie:
              description: 세션이 없을 때 발급한다.
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: {type: string}
  /api/v1/catalog/variants:
    get:
      operationId: listActiveVariants
      summary: 신청 화면의 활성 SKU를 조회한다
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          description: SKU 코드 또는 상품명 검색
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: SKU 코드·ID 오름차순으로 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantPage'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/replenishment-requests:
    get:
      operationId: listReplenishmentRequests
      summary: 본인 소속의 보충 요청 목록을 조회한다
      description: 매장 직원은 활성 소속 매장의 도착 건, 승인·물류 운영 담당자는 활성 소속 창고의 출발 건을 조회한다. 두 역할을 보유하면 허용 집합의 합집합을 반환한다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema:
            type: string
            enum: [SUBMITTED, FULFILLING, CANCELLED, REJECTED, COMPLETED]
      responses:
        '200':
          description: 제출 시각과 ID 내림차순으로 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: submitReplenishmentRequest
      summary: 보충 신청을 제출한다
      description: |
        매장 직원이 소속 매장에 대해 신청한다. 인증된 사용자를 요청자로 기록한다.
        초안을 거치지 않고 SUBMITTED로 생성한다. 같은 SKU를 여러 줄에 넣을 수 없다.
        성공 키는 사용자와 제출 명령 범위에서 유일하다. 같은 키와 동일한 입력은
        최초 201 응답과 Location을 반환하며 새 요청을 만들지 않는다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Submission'
      responses:
        '201':
          description: 제출 완료 또는 기존 제출 결과 반환
          headers:
            Location:
              schema:
                type: string
              description: 생성한 요청의 상대 URI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/replenishment-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getReplenishmentRequest
      summary: 보충 요청 상세를 조회한다
      description: 소속 매장 직원 또는 조회 권한이 있는 담당자만 조회할 수 있다.
      responses:
        '200':
          description: 현재 요청 상태와 SKU별 이행 수량
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/replenishment-requests/{requestId}/approvals:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: approveReplenishmentRequest
      summary: 보충 요청을 승인하고 재고를 예약한다
      description: |
        활성 소속 창고가 출발지인 요청만 승인할 수 있다. SUBMITTED에서 최초 승인,
        FULFILLING에서 부분 이행 허용 건의 열린 잔량을 추가 승인한다. 부분 이행 불허 건은 출고 지시 취소 이후 모든 항목의 전체 요청 수량이 열린 잔량으로 돌아온 경우 전량을 다시 승인할 수 있다.
        모든 요청 항목을 한 번씩 포함한다. 부분 허용 시 항목별 0은 가능하나 전체 0은
        거절한다. 부분 불허 시 전체 요청 수량을 승인해야 한다. 열린 잔량보다 적게
        승인할 때는 사유가 필요하다. 지정한 모든 SKU의 예약은 함께 성공하거나 롤백된다.
        409 INSUFFICIENT_STOCK의 가용 수량은 실패 시점의 관측값이다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Approval'
      responses:
        '201':
          description: 승인 회차 확정 또는 기존 성공 결과 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResult'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'
  /api/v1/replenishment-requests/{requestId}/cancellation:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: cancelReplenishmentRequest
      summary: 출고 지시가 생성되기 전에 보충 요청 전체를 취소한다
      description: |
        소속 매장 직원이 SUBMITTED 또는 FULFILLING 요청을 취소한다.
        출고 지시가 한 건이라도 생성된 요청은 DISPATCH_ALREADY_CREATED로 거절한다.
        유효 예약 해제, 열린 잔량 종결, 요청 상태와 이력을 함께 반영한다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancellation'
      responses:
        '200':
          description: CANCELLED 상태의 요청 또는 기존 성공 결과 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'
  /api/v1/replenishment-requests/{requestId}/outbound-orders:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: createOutboundOrder
      summary: 확보한 재고의 출고 지시를 생성한다
      description: |
        출발 창고에 활성 소속된 물류 운영 담당자가 실행한다.
        활성 출고 지시가 없는 FULFILLING 요청의 유효 예약을 새 지시에 배정한다. 부분 이행 불허 건은 전량을 확보해야 한다.
        요청 행을 잠그고 기존 성공 키를 확인한 뒤 버전과 배정 가능 여부를 검사한다.
        지시와 Outbox를 함께 저장하고 DISPATCH_PENDING 결과를 반환한다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion:
                  $ref: '#/components/schemas/Version'
      responses:
        '201':
          description: 지시 생성 또는 기존 성공 응답 재생
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundOrder'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'
  /api/v1/replenishment-requests/{requestId}/outbound-orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: orderId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getOutboundOrder
      summary: 출고 지시 상세를 조회한다
      description: 도착 매장 직원 또는 출발 창고의 승인·물류 운영 담당자가 조회한다.
      responses:
        '200':
          description: 현재 출고 진행 상태와 수량
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundOrder'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/replenishment-requests/{requestId}/outbound-orders/{orderId}/cartons:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: listOutboundCartons
      summary: 출고 지시의 박스와 검수 상태를 조회한다
      description: 도착 매장 직원 또는 출발 창고의 승인·물류 운영 담당자가 조회한다. 출고 확정 전에는 빈 목록을 반환한다.
      responses:
        '200':
          description: 박스 ID 오름차순의 목록과 현재 요청 버전
          content:
            application/json:
              schema:
                type: object
                required: [requestVersion, cartons]
                properties:
                  requestVersion:
                    $ref: '#/components/schemas/Version'
                  cartons:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReceivingCarton'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/replenishment-requests/{requestId}/outbound-orders/{orderId}/cartons/{cartonId}/receipt:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
      - name: cartonId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: confirmInitialReceipt
      summary: 출고 박스의 최초 검수를 확정한다
      description: |
        도착 매장에 활성 소속된 매장 직원만 확정할 수 있다. 박스 내 모든 출고 항목을
        한 번씩 제출한다. 정상·파손 수량의 합은 출고 수량 이하다. 차이는 항목별 부족·파손 건으로 반환한다.
        요청 잠금 아래 기존 성공 키를 확인하고 동일 입력에 최초 201 응답을 반환한다.
        이후 박스 확정 여부, 요청 버전, 상태 순으로 확인한다. 새 키로 이미 확정된
        박스를 요청하면 RECEIPT_ALREADY_CONFIRMED를 반환한다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmInitialReceipt'
      responses:
        '201':
          description: 확정 완료 또는 동일 명령의 기존 성공 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialReceiptResult'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'
  /api/v1/replenishment-requests/{requestId}/outbound-orders/{orderId}/cartons/{cartonId}/shortages/{shortageId}/additional-receipts:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
      - name: cartonId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: shortageId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: confirmAdditionalReceipt
      summary: 부족 수량의 추가 도착을 확정한다
      description: 도착 매장의 활성 소속 직원만 처리한다. 성공 키 재생 후 요청 버전과 현재 부족 잔량을 확인한다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, receivedQty]
              properties:
                expectedVersion:
                  $ref: '#/components/schemas/Version'
                receivedQty:
                  $ref: '#/components/schemas/PositiveQuantity'
      responses:
        '201':
          description: 추가 입고 확정 또는 기존 성공 결과
          content:
            application/json:
              schema:
                type: object
                required: [additionalReceiptId, confirmedAt, requestVersion, requestStatus, carton]
                properties:
                  additionalReceiptId:
                    $ref: '#/components/schemas/Id'
                  confirmedAt:
                    type: string
                    format: date-time
                  requestVersion:
                    $ref: '#/components/schemas/Version'
                  requestStatus:
                    type: string
                    enum: [FULFILLING, COMPLETED]
                  carton:
                    $ref: '#/components/schemas/ReceivingCarton'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'
  /api/v1/replenishment-requests/{requestId}/outbound-orders/{orderId}/cartons/{cartonId}/shortages/{shortageId}/losses:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
      - name: cartonId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: shortageId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: confirmTransitLoss
      summary: 부족 수량의 운송 손실을 확정한다
      description: 출발 창고의 활성 소속 물류 운영 담당자만 처리한다. 성공 키 재생 후 요청 버전과 현재 부족 잔량을 확인한다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, lostQty, reason, evidenceReference]
              properties:
                expectedVersion:
                  $ref: '#/components/schemas/Version'
                lostQty:
                  $ref: '#/components/schemas/PositiveQuantity'
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                evidenceReference:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '201':
          description: 운송 손실 확정 또는 기존 성공 결과
          content:
            application/json:
              schema:
                type: object
                required: [lossId, confirmedAt, requestVersion, requestStatus, carton]
                properties:
                  lossId:
                    $ref: '#/components/schemas/Id'
                  confirmedAt:
                    type: string
                    format: date-time
                  requestVersion:
                    $ref: '#/components/schemas/Version'
                  requestStatus:
                    type: string
                    enum: [FULFILLING, COMPLETED]
                  carton:
                    $ref: '#/components/schemas/ReceivingCarton'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'
  /api/v1/replenishment-requests/{requestId}/outbound-orders/{orderId}/cartons/{cartonId}/damages/{damageId}/disposals:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
      - name: cartonId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: damageId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: confirmDamageDisposal
      summary: 파손 보류 재고의 폐기를 확정한다
      description: 출발 창고의 활성 소속 물류 운영 담당자만 처리한다. 성공 키 재생 후 요청 버전과 현재 파손 보류 잔량을 확인한다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, disposedQty, reason, evidenceReference]
              properties:
                expectedVersion:
                  $ref: '#/components/schemas/Version'
                disposedQty:
                  $ref: '#/components/schemas/PositiveQuantity'
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                evidenceReference:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '201':
          description: 폐기 확정 또는 기존 성공 결과
          content:
            application/json:
              schema:
                type: object
                required: [disposalId, confirmedAt, requestVersion, requestStatus, carton]
                properties:
                  disposalId:
                    $ref: '#/components/schemas/Id'
                  confirmedAt:
                    type: string
                    format: date-time
                  requestVersion:
                    $ref: '#/components/schemas/Version'
                  requestStatus:
                    type: string
                    enum: [FULFILLING, COMPLETED]
                  carton:
                    $ref: '#/components/schemas/ReceivingCarton'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'
  /api/v1/replenishment-requests/{requestId}/outbound-orders/{orderId}/cancellation:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: requestOutboundCancellation
      summary: WMS에 출고 취소를 요청한다
      description: 기본 모드는 도착 매장 직원이 요청한다. outboundOnly 모드는 창고 물류 운영 담당자가 피킹 부족 상태에서 사용하며, WMS 취소 확정 후 해제된 수량을 요청의 열린 잔량으로 돌린다. WMS 확인 전에는 예약을 유지한다. 동일 성공 키는 최초 202를 반환한다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
        - name: outboundOnly
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancellation'
      responses:
        '202':
          description: 취소 확인 중 또는 기존 성공 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundOrder'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'

  /api/v1/replenishment-requests/{requestId}/outbound-orders/{orderId}/partial-release:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: approvePartialOutboundRelease
      summary: 피킹으로 확보된 수량의 부분 출고를 승인한다
      description: |
        출발 창고 소속 물류 운영 담당자가 실행한다. 부분 이행 허용 요청의
        PICKING_EXCEPTION 지시만 처리하며 양수 확보 수량이 있어야 한다.
        요청 버전과 피킹 리비전을 검사하고 승인과 WMS 전달 기록을 함께 저장한다.
        동일한 성공 명령은 최초 202 결과를 반환한다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, pickingRevision]
              properties:
                expectedVersion:
                  $ref: '#/components/schemas/Version'
                pickingRevision:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: 부분 출고 승인 접수 또는 기존 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundOrder'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'

  /api/v1/replenishment-requests/{requestId}/outbound-orders/{orderId}/items/{orderItemId}/picking-shortage-resolution:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
      - name: orderItemId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: resolvePickingShortage
      summary: 창고 피킹 차이 조사를 종결한다
      description: 출발 창고에 활성 소속된 물류 운영 담당자가 수행한다. 기존 성공 명령은 당시 결과를 반환한다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, outcome, reason, evidenceReference]
              properties:
                expectedVersion:
                  $ref: '#/components/schemas/Version'
                reason: {type: string, minLength: 1, maxLength: 500}
                outcome: {type: string, enum: [FOUND, LOSS]}
                evidenceReference: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: 종결 결과 또는 기존 성공 응답
          content:
            application/json:
              schema:
                type: object
                required: [orderItemId, quantity, outcome, requestVersion, requestStatus]
                properties:
                  requestVersion:
                    $ref: '#/components/schemas/Version'
                  requestStatus:
                    type: string
                    enum: [FULFILLING, COMPLETED, CANCELLED]
                  orderItemId:
                    $ref: '#/components/schemas/Id'
                  quantity:
                    $ref: '#/components/schemas/PositiveQuantity'
                  outcome: {type: string, enum: [FOUND, LOSS]}
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'

  /api/v1/replenishment-requests/{requestId}/items/{itemId}/unfulfilled-closure:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: itemId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: closeUnfulfilledRemainder
      summary: 열린 요청 잔량 전체를 미충족 종결한다
      description: 출고 이력이 있거나 모든 출고 지시가 취소된 이행 중 요청에서 사용한다. 출고가 없고 모든 지시가 취소된 경우, 잔량과 재고 조사가 모두 종결되면 정상 입고 0으로 완료된다.
      description: 출발 창고에 활성 소속된 물류 운영 담당자가 수행한다. 기존 성공 명령은 당시 결과를 반환한다.
      parameters:
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, reason]
              properties:
                expectedVersion:
                  $ref: '#/components/schemas/Version'
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: 종결 결과 또는 기존 성공 응답
          content:
            application/json:
              schema:
                type: object
                required: [requestItemId, closedQty, requestVersion, requestStatus]
                properties:
                  requestVersion:
                    $ref: '#/components/schemas/Version'
                  requestStatus:
                    type: string
                    enum: [FULFILLING, COMPLETED, CANCELLED]
                  requestItemId:
                    $ref: '#/components/schemas/Id'
                  closedQty:
                    $ref: '#/components/schemas/PositiveQuantity'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/TemporaryFailure'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CommandKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        논리적 명령마다 새 키를 만든다. 승인·취소는 명령 종류, 요청 ID, 인증
        사용자, 키 범위로 성공을 저장한다. 현재 권한 확인 후 버전·상태 검사보다
        먼저 성공 기록을 조회한다. 동일 본문이면 당시 응답을 반환하고 다른 본문이면
        IDEMPOTENCY_CONFLICT를 반환한다. 항목 순서는 해시 계산에서 무시한다.
        실패는 키를 소비하지 않는다. 버전과 수량을 바꿔 재시도할 때는 새 키를 쓴다.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadInput:
      description: 필수 입력 누락, 수량·항목·거점 유효성 오류 (VALIDATION_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 로그인 세션 없음 또는 만료 (UNAUTHENTICATED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 역할·소속 등 접근 권한 부족 또는 CSRF 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 요청이나 경로에 속한 항목·출고 지시·박스·차이 건을 찾을 수 없음 (REQUEST_NOT_FOUND, REQUEST_ITEM_NOT_FOUND, OUTBOUND_ORDER_NOT_FOUND, OUTBOUND_CARTON_NOT_FOUND, PICKING_SHORTAGE_NOT_FOUND, RECEIPT_SHORTAGE_NOT_FOUND, RECEIPT_DAMAGE_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        IDEMPOTENCY_CONFLICT는 성공한 키를 다른 입력으로 사용한 경우다.
        VERSION_CONFLICT 또는 PICKING_REVISION_CONFLICT는 상세를 다시 조회해야 한다.
        PICKING_SHORTAGE_ALREADY_RESOLVED는 이미 종결된 창고 조사에 새 명령을 보낸 경우다.
        PARTIAL_RELEASE_NOT_ALLOWED는 부분 이행이 금지됐거나 유효한 확보 수량이 없는 경우다.
        INVALID_STATE는 현재 요청 상태에서 명령을 허용하지 않는 경우다.
        INSUFFICIENT_STOCK은 승인 전체가 롤백된 경우다.
        RECEIPT_DAMAGE_CONFLICT는 파손 건이 종결됐거나 폐기 수량이 현재 보류 잔량을 초과한 경우다.
        RECEIPT_SHORTAGE_CONFLICT는 부족 건이 종결됐거나 입력이 현재 잔량을 초과한 경우다.
        RECEIPT_ALREADY_CONFIRMED는 새 명령으로 이미 확정된 박스를 처리한 경우다.
        DISPATCH_ALREADY_CREATED는 출고 전 취소 범위를 벗어나거나 활성 출고 지시가 이미 있는 경우다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TemporaryFailure:
      description: 잠금·트랜잭션 재시도 소진 (TEMPORARY_CONFLICT). 같은 명령은 동일 키로 재시도할 수 있다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ReceivingCarton:
      type: object
      required: [id, cartonNo, inspectionStatus, lines]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        cartonNo:
          type: string
        inspectionStatus:
          type: string
          enum: [PENDING, CONFIRMED]
        receiptId:
          $ref: '#/components/schemas/Id'
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [outboundOrderItemId, skuCode, shippedQty, receivedQty, damagedQty, lostQty, inTransitQty]
            properties:
              outboundOrderItemId:
                $ref: '#/components/schemas/Id'
              skuCode:
                type: string
              shippedQty:
                $ref: '#/components/schemas/PositiveQuantity'
              receivedQty:
                $ref: '#/components/schemas/Quantity'
              damagedQty:
                $ref: '#/components/schemas/Quantity'
              damage:
                $ref: '#/components/schemas/ReceivingDamage'
              lostQty:
                $ref: '#/components/schemas/Quantity'
              inTransitQty:
                $ref: '#/components/schemas/Quantity'
              shortage:
                $ref: '#/components/schemas/ReceivingShortage'
    ReceivingDamage:
      type: object
      required: [id, initialQty, remainingQty, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        initialQty:
          $ref: '#/components/schemas/PositiveQuantity'
        remainingQty:
          $ref: '#/components/schemas/Quantity'
        status:
          type: string
          enum: [OPEN, RESOLVED]
    ReceivingShortage:
      type: object
      required: [id, initialQty, remainingQty, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        initialQty:
          $ref: '#/components/schemas/PositiveQuantity'
        remainingQty:
          $ref: '#/components/schemas/Quantity'
        status:
          type: string
          enum: [OPEN, RESOLVED]
    ConfirmInitialReceipt:
      type: object
      additionalProperties: false
      required: [expectedVersion, lines]
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        lines:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [outboundOrderItemId, receivedQty]
            properties:
              outboundOrderItemId:
                $ref: '#/components/schemas/Id'
              receivedQty:
                $ref: '#/components/schemas/Quantity'
              damagedQty:
                description: 파손 확인 수량. 생략하면 0이다.
                default: 0
                type: integer
                format: int32
                minimum: 0
    InitialReceiptResult:
      type: object
      required: [receiptId, confirmedAt, requestVersion, requestStatus, carton]
      properties:
        receiptId:
          $ref: '#/components/schemas/Id'
        confirmedAt:
          type: string
          format: date-time
        requestVersion:
          $ref: '#/components/schemas/Version'
        requestStatus:
          type: string
          enum: [FULFILLING, COMPLETED]
        carton:
          $ref: '#/components/schemas/ReceivingCarton'
    OutboundOrder:
      type: object
      required: [id, requestId, requestVersion, externalOrderId, status, cancellationStatus, lines]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        requestId:
          $ref: '#/components/schemas/Id'
        requestVersion:
          $ref: '#/components/schemas/Version'
        externalOrderId:
          type: string
        status:
          type: string
          enum: [DISPATCH_PENDING, ACCEPTANCE_UNKNOWN, ACCEPTED, WORKING, PICKING_EXCEPTION, READY_TO_SHIP, SHIPPED, CANCELLED]
        pickingRevision:
          type: integer
          minimum: 1
        partialReleaseStatus:
          type: string
          enum: [PENDING, REQUESTED]
        cancellationStatus:
          type: string
          enum: [NONE, REQUESTED, CONFIRMED, REJECTED]
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, requestItemId, skuCode, instructedQty, shippedQty, damagedQty, lostQty, inTransitQty]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              requestItemId:
                $ref: '#/components/schemas/Id'
              skuCode:
                type: string
              pickingShortage:
                type: object
                required: [quantity, status]
                properties:
                  quantity:
                    $ref: '#/components/schemas/PositiveQuantity'
                  status: {type: string, enum: [OPEN, RESOLVED]}
                  outcome: {type: string, enum: [FOUND, LOSS]}
              pickedQty:
                $ref: '#/components/schemas/Quantity'
              shortageQty:
                $ref: '#/components/schemas/Quantity'
              instructedQty:
                $ref: '#/components/schemas/PositiveQuantity'
              shippedQty:
                $ref: '#/components/schemas/Quantity'
              damagedQty:
                $ref: '#/components/schemas/Quantity'
              lostQty:
                $ref: '#/components/schemas/Quantity'
              inTransitQty:
                $ref: '#/components/schemas/Quantity'
    RequestPage:
      type: object
      required: [items, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestDetail'
        hasNext: {type: boolean}
    VariantPage:
      type: object
      required: [items, hasNext]
      properties:
        items:
          type: array
          items:
            type: object
            required: [variantId, skuCode, productName, colorCode, sizeCode]
            properties:
              variantId:
                $ref: '#/components/schemas/Id'
              skuCode: {type: string}
              productName: {type: string}
              colorCode: {type: string}
              sizeCode: {type: string}
        hasNext: {type: boolean}
    Id:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: 양수이며 signed bigint 범위로 제한한다.
    Version:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: 0 이상의 signed bigint 버전이다.
    Quantity:
      type: integer
      format: int32
      minimum: 0
    PositiveQuantity:
      type: integer
      format: int32
      minimum: 1
    Submission:
      type: object
      additionalProperties: false
      required: [sourceLocationId, destinationLocationId, desiredReceiptDate, allowPartial, lines]
      properties:
        sourceLocationId:
          $ref: '#/components/schemas/Id'
        destinationLocationId:
          $ref: '#/components/schemas/Id'
        desiredReceiptDate:
          type: string
          format: date
        allowPartial:
          type: boolean
        lines:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [variantId, requestedQty]
            properties:
              variantId:
                $ref: '#/components/schemas/Id'
              requestedQty:
                $ref: '#/components/schemas/PositiveQuantity'
    Approval:
      type: object
      additionalProperties: false
      required: [expectedVersion, lines]
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        lines:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [requestItemId, approvedQty]
            properties:
              requestItemId:
                $ref: '#/components/schemas/Id'
              approvedQty:
                $ref: '#/components/schemas/Quantity'
    Cancellation:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ApprovalResult:
      type: object
      required: [approvalId, request, reservations]
      properties:
        approvalId:
          $ref: '#/components/schemas/Id'
        request:
          $ref: '#/components/schemas/RequestDetail'
        reservations:
          type: array
          minItems: 1
          description: 이번 회차에 양수 승인으로 생성된 예약만 포함한다.
          items:
            type: object
            required: [reservationId, requestItemId, reservedQty]
            properties:
              reservationId:
                $ref: '#/components/schemas/Id'
              requestItemId:
                $ref: '#/components/schemas/Id'
              reservedQty:
                $ref: '#/components/schemas/PositiveQuantity'
    RequestDetail:
      type: object
      required: [id, requestNo, sourceLocationId, destinationLocationId, requestedBy, status, version, allowPartial, desiredReceiptDate, submittedAt, lines]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        requestNo:
          type: string
        outboundOrders:
          type: array
          description: 요청의 모든 출고 지시를 생성 순서대로 표시한다.
          items:
            type: object
            required: [id, status]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              status:
                type: string
                enum: [DISPATCH_PENDING, ACCEPTANCE_UNKNOWN, ACCEPTED, WORKING, PICKING_EXCEPTION, READY_TO_SHIP, SHIPPED, CANCELLED]
        receivedQty:
          type: integer
          format: int64
          minimum: 0
          description: 모든 출고 지시의 누적 정상 입고 수량
        outboundOrderId:
          type: string
          pattern: '^[1-9][0-9]{0,18}$'
          description: 호환용 최신 출고 지시 ID. 전체 목록은 outboundOrders를 사용한다.
        sourceLocationId:
          $ref: '#/components/schemas/Id'
        destinationLocationId:
          $ref: '#/components/schemas/Id'
        requestedBy:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum: [SUBMITTED, FULFILLING, REJECTED, CANCELLED, COMPLETED]
        version:
          $ref: '#/components/schemas/Version'
        allowPartial:
          type: boolean
        desiredReceiptDate:
          type: string
          format: date
        submittedAt:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RequestLine'
    RequestLine:
      type: object
      description: 요청 수량은 열린 잔량, 유효 예약, 출고, 미충족 종결 수량의 합이다.
      required: [id, variantId, skuCode, requestedQty, openQty, reservedQty, shippedQty, closedQty]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        variantId:
          $ref: '#/components/schemas/Id'
        skuCode:
          type: string
        requestedQty:
          $ref: '#/components/schemas/PositiveQuantity'
        openQty:
          $ref: '#/components/schemas/Quantity'
        reservedQty:
          $ref: '#/components/schemas/Quantity'
        shippedQty:
          $ref: '#/components/schemas/Quantity'
        closedQty:
          $ref: '#/components/schemas/Quantity'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, CSRF_INVALID, REQUEST_NOT_FOUND, OUTBOUND_ORDER_NOT_FOUND, REQUEST_ITEM_NOT_FOUND, PICKING_SHORTAGE_NOT_FOUND, PICKING_SHORTAGE_ALREADY_RESOLVED, OUTBOUND_CARTON_NOT_FOUND, RECEIPT_SHORTAGE_NOT_FOUND, RECEIPT_DAMAGE_NOT_FOUND, RECEIPT_DAMAGE_CONFLICT, RECEIPT_SHORTAGE_CONFLICT, RECEIPT_ALREADY_CONFIRMED, IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, PICKING_REVISION_CONFLICT, PARTIAL_RELEASE_NOT_ALLOWED, INVALID_STATE, INSUFFICIENT_STOCK, DISPATCH_ALREADY_CREATED, TEMPORARY_CONFLICT]
        message:
          type: string
        currentVersion:
          $ref: '#/components/schemas/Version'
        shortages:
          type: array
          description: INSUFFICIENT_STOCK일 때 확인된 부족 항목을 반환한다.
          items:
            type: object
            required: [requestItemId, attemptedQty, availableQty]
            properties:
              requestItemId:
                $ref: '#/components/schemas/Id'
              attemptedQty:
                $ref: '#/components/schemas/PositiveQuantity'
              availableQty:
                $ref: '#/components/schemas/Quantity'
